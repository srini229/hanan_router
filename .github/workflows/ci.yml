name: CI

# Build the router and run the smoke-test suite on every commit to master
# (and on pull requests targeting master). The job status becomes the commit's
# status check.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  smoke:
    name: build + smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build hanan_router
        run: make -j"$(nproc)"

      - name: Run smoke tests
        run: |
          chmod +x test/run_smoke.sh
          make test
